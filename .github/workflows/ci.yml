name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Syntax gate
        run: python -m py_compile src/warden.py src/manifest.py src/run_server.py src/validate_config.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke
        run: |
          python src/warden.py --help >/dev/null
          python src/manifest.py --help >/dev/null

      - name: Config validation smoke (CLI mode)
        run: python src/validate_config.py --no-webhook --app-id 1234567 --model ollama/qwen2.5-coder:14b --key "-----BEGIN RSA PRIVATE KEY-----"
