[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-warden"
version = "0.2.0"
description = "Self-hosted AI pull-request reviewer - your own CodeRabbit on local Ollama or any cloud model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "grloper" }]
keywords = ["code-review", "pr-reviewer", "ollama", "github-app", "self-hosted", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
engine = ["pr-agent>=0.44"]

[project.scripts]
warden = "warden:console_entry"
warden-server = "run_server:console_entry"
warden-manifest = "manifest:console_entry"
warden-validate = "validate_config:console_entry"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["warden", "manifest", "run_server", "validate_config", "insights", "askrepo"]
